name: 666DEV one-time R06 exposed workflow-run cleanup
on:
  push:
    branches:
      - security/666dev-r07-recovery-and-handoff-hardening-20261122
    paths:
      - .github/workflows/cleanup-r06-run.yml

permissions:
  actions: write
  contents: read

jobs:
  delete-exact-r06-run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify run identity and delete exact old run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, sys
          repo = 'xfraggelpower666x/666SOUNDsDESIGn-APP-DEVELOPMENT'
          run_id = 44970731875
          bad_commit = '2042890ed10568fd87f6deb756e7ec30dab31014'
          bad_branch = 'audit/666dev-native-plugin-capability-parity-20261122'
          if os.environ.get('GH_REPO') != repo:
              raise SystemExit('WRITE_BLOCKED: wrong repository')
          root = 'https://api.github.com/repos/' + repo
          headers = {'Accept':'application/vnd.github+json',
                     'Authorization':'Bearer ' + os.environ['GH_TOKEN'],
                     'X-GitHub-Api-Version':'2022-11-28'}
          def call(method, path):
              req = urllib.request.Request(root + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req,timeout=20) as response:
                      body=response.read()
                      return response.status,json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  return exc.code,None
          status, run = call('GET', '/actions/runs/' + str(run_id))
          if status == 404:
              print('VERIFIZIERT: exposed workflow run already absent (404)')
              sys.exit(0)
          if (status != 200 or not isinstance(run,dict)
                  or run.get('id') != run_id
                  or run.get('head_sha') != bad_commit
                  or run.get('head_branch') != bad_branch):
              raise SystemExit('CONFLICT_QUARANTINE: workflow identity differs')
          a, artifacts = call('GET', '/actions/runs/' + str(run_id) + '/artifacts')
          if a != 200 or not isinstance(artifacts,dict) or artifacts.get('total_count') != 0:
              raise SystemExit('WRITE_BLOCKED: old run still holds artifacts')
          print('VERIFIZIERT: exact old run and no residual artifacts')
          response, _ = call('DELETE', '/actions/runs/' + str(run_id))
          if response != 204:
              raise SystemExit('WRITE_BLOCKED: GitHub run deletion rejected HTTP ' + str(response))
          verify, _ = call('GET', '/actions/runs/' + str(run_id))
          if verify != 404:
              raise SystemExit('READBACK_PENDING: run delete not verified by GET 404')
          print('VERIFIZIERT: old workflow run removed; GET 404')
          PY
