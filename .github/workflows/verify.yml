name: 666DEV verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Guard public repository against private plugin source re-exposure
        env:
          PYTHONPATH: src
        run: python -m devhub.intelligence.publication_safety
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s projects/demo-monorepo/app/tests -v
      - name: Verify repository contracts
        env:
          PYTHONPATH: src
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=HEAD
          fi
          python -m devhub.verifier --base "$BASE_SHA"
      - name: Repo Mind hygiene report
        env:
          PYTHONPATH: src
          RENAME_BASE: ${{ github.event.pull_request.base.sha || 'HEAD' }}
        run: |
          git merge-base "$RENAME_BASE" HEAD > "$RUNNER_TEMP/666repo-mind-base"
          python -m devhub.cli 666DEV REPO-MIND CHECK "$(cat "$RUNNER_TEMP/666repo-mind-base")"
          python -m devhub.cli 666DEV REPO-MIND INDEX

      - name: Build revision-bound recovery artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/666DEV'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/666dev-recovery"
          git archive --format=zip --output="$RUNNER_TEMP/666dev-recovery/666DEV-source.zip" HEAD
          git bundle create "$RUNNER_TEMP/666dev-recovery/666DEV-history.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/666dev-recovery/666DEV-history.bundle"
          python - <<'PYREC'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "666dev-recovery"
          result = {"schema": "666dev-recovery/v1",
                    "scope": "tracked source at HEAD and Git history reachable from HEAD",
                    "excluded": ["ignored .work state", "working tree local data", "unreachable branches"],
                    "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
                    "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
                    "artifacts": {}}
          for item in ("666DEV-source.zip", "666DEV-history.bundle"):
              path = root / item
              result["artifacts"][item] = {"bytes": path.stat().st_size,
                                          "sha256": hashlib.sha256(path.read_bytes()).hexdigest()}
          (root / "manifest.json").write_text(json.dumps(result, indent=2) + "\n")
          PYREC
      - name: Publish revision-bound recovery artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/666DEV'
        uses: actions/upload-artifact@v4
        with:
          name: 666DEV-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/666dev-recovery/
          retention-days: 30
          if-no-files-found: error
