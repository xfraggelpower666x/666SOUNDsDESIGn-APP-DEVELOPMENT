name: 666DEV verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s projects/demo-monorepo/app/tests -v
      - name: Verify repository contracts
        env:
          PYTHONPATH: src
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD' }}
        run: python -m devhub.verifier --base "$BASE_SHA"
