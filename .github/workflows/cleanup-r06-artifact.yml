name: 666DEV one-time R06 exposed artifact removal
on:
  push:
    branches:
      - security/666dev-r07-recovery-and-handoff-hardening-20261122
    paths:
      - .github/workflows/cleanup-r06-artifact.yml

permissions:
  contents: read
  actions: write

jobs:
  remove-exact-exposed-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify identity and delete only original exposed recovery artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, sys
          repo = 'xfraggelpower666x/666SOUNDsDESIGn-APP-DEVELOPMENT'
          artifact_id = 14733154164
          source_run_id = 44970731875
          bad_commit = '2042890ed10568fd87f6deb756e7ec30dab31014'
          expected_name = '666DEV-recovery-' + bad_commit
          if os.environ.get('GH_REPO') != repo:
              raise SystemExit('WRITE_BLOCKED: wrong repository')
          base = 'https://api.github.com/repos/' + repo
          headers = {'Accept':'application/vnd.github+json',
                     'Authorization':'Bearer ' + os.environ['GH_TOKEN'],
                     'X-GitHub-Api-Version':'2022-11-28'}
          def call(method, uri):
              req = urllib.request.Request(base + uri, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as response:
                      data = response.read()
                      return response.status, json.loads(data) if data else None
              except urllib.error.HTTPError as exc:
                  return exc.code, None
          status, record = call('GET', '/actions/artifacts/' + str(artifact_id))
          if status == 404:
              print('VERIFIZIERT: exact exposed artifact already absent (404)')
              sys.exit(0)
          if status != 200 or not isinstance(record, dict):
              raise SystemExit('READBACK_PENDING: cannot verify artifact metadata')
          run = record.get('workflow_run') or {}
          if (record.get('id') != artifact_id or record.get('name') != expected_name
              or run.get('id') != source_run_id or run.get('head_sha') != bad_commit):
              raise SystemExit('CONFLICT_QUARANTINE: artifact identity mismatch')
          print('VERIFIZIERT: exact artifact metadata matched; delete authorized ID only')
          code, _ = call('DELETE', '/actions/artifacts/' + str(artifact_id))
          if code != 204:
              raise SystemExit('WRITE_BLOCKED: artifact delete rejected: HTTP ' + str(code))
          verify, _ = call('GET', '/actions/artifacts/' + str(artifact_id))
          if verify != 404:
              raise SystemExit('READBACK_PENDING: delete response received but GET not 404')
          print('VERIFIZIERT: exact artifact ID removed and GET returned 404')
          PY
